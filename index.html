<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>考研历史时间轴</title>
<meta name="description" content="考研统考历史学（313）备考时间轴：中国史历代考点事件按章分期呈现，时间轴 / 地图 / 复习 / 关系图谱四视图联动，支持朝代速览、事件定位、关系梳理与自测巩固。">
<meta property="og:site_name" content="考研历史时间轴">
<meta property="og:title" content="考研历史时间轴">
<meta property="og:description" content="考研统考历史学（313）备考时间轴：中国史历代考点事件按章分期呈现，时间轴 / 地图 / 复习三视图联动，支持朝代速览、事件定位与自测巩固。">
<meta property="og:type" content="website">
<meta property="og:locale" content="zh_CN">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<!-- 字体异步加载（2026-08-05）：jsdelivr 挂起不阻塞渲染，页面先以系统字体显示，字体就绪后自动切换（font-display:swap） -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/400.css" media="print" onload="this.media='all'" integrity="sha384-KnTh4qCHjvV+icYFQKXjjlKZu9alWMJzc6O8NrYYm0A0Wed8ec9ekCuLi4P9iGA6" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/700.css" media="print" onload="this.media='all'" integrity="sha384-+VJ42QNJY5J0fJiq6GZfRN9yTBORo6g6f0X3RGTQ4Uz1HYnxpbjNIqfu6oLQ5/jF" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/900.css" media="print" onload="this.media='all'" integrity="sha384-S+CvOyAMc8HNWT+V9dBDPcoex0HSsHBuTBlB1ozd1ah31NYn98+T0OJZ1bQnedpR" crossorigin="anonymous">
<noscript>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/400.css" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/700.css" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/900.css" crossorigin="anonymous">
</noscript>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" integrity="sha384-pmjIAcz2bAn0xukfxADbZIb3t8oRT9Sv0rvO+BR5Csr6Dhqq+nZs59P0pPKQJkEV" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" integrity="sha384-wgw+aLYNQ7dlhK47ZPK7FRACiq7ROZwgFNg0m04avm4CaXS+Z9Y7nMu8yNjBKYC+" crossorigin="anonymous">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="topbar" id="topbar">
  <div class="tb-inner">
    <!-- L1 站级：固定总名，不随史段变（交接文档 §10.6.1） -->
    <h1>考研历史时间轴</h1>
    <!-- L2 史段级：纯文字切换器，当前项主色+加粗；世界史两段规划中禁用 -->
    <div class="seg-row" id="segRow">
      <button class="seg-btn on" data-seg="ancient">中国古代史</button>
      <button class="seg-btn" data-seg="modern">中国近现代史</button>
      <button class="seg-btn" data-seg="world-ancient">世界古代中世纪史</button>
      <button class="seg-btn" data-seg="world-modern">世界近现代史</button>
    </div>
    <!-- L3 视图级：tab 靠左（无分割细线） -->
    <div class="tb-row1">
      <div class="tb-tabs" id="viewTabs">
        <button class="tab on" data-view="timeline">时间轴</button>
        <button class="tab" data-view="map">地图</button>
        <button class="tab" data-view="review">复习</button>
        <button class="tab" data-view="relation">关系</button>
        <button class="tab" data-view="parallel">对照</button>
      </div>
      <button class="f edit-toggle" id="editToggle" title="可视化编辑事件（本地服务）" hidden>编辑</button>
    </div>
    <div class="bar" id="bar">
      <input type="search" class="search" id="q" placeholder="搜索事件…">
      <button class="f toggle" id="filterToggle" title="展开/收起筛选">筛选</button>
      <span class="chips" id="chips"></span>
      <span class="cnt" id="cnt"></span>
      <div class="filters" id="filters" hidden>
        <span class="group" id="perGroup">
          <span class="glabel">分期</span>
        </span>
        <span class="group" id="typeGroup">
          <span class="glabel">门类</span>
        </span>
        <span class="group" id="impGroup">
          <span class="glabel">等第</span>
        </span>
      </div>
    </div>
  </div>
</div>
<div class="wrap">
  <div class="view" id="view-timeline">
    <button class="f add-ev" id="addEvent" hidden>＋ 新增事件</button>
    <main id="main"></main>
    <div class="empty" id="empty" hidden>当前筛选下没有事件。</div>
  </div>
  <div class="view mapview" id="view-map" hidden>
    <div class="maptool">
      <span class="mt-g mt-g-mode">
        <span class="glabel">地图</span>
        <select id="rangeSel" class="range-sel" title="选择地图：原始社会 / 历史时期 / 中国近现代史 / 世界古代 / 世界近现代">
          <option value="pre">原始社会（史前）</option>
          <option value="hist" selected>历史时期（夏~清）</option>
          <option value="modern">中国近现代史（1838-2012）</option>
          <option value="world-ancient">世界古代中世纪史</option>
          <option value="world-modern">世界近现代史</option>
        </select>
      </span>
      <span class="mt-g mt-g-slider">
        <span class="yrlabel" id="yrLabel">全部年份</span>
        <button class="f" id="stepPrev" title="上一个事件（精准定位）">◀</button>
        <input type="range" id="yrSlider" step="1" aria-label="年代">
        <button class="f" id="stepNext" title="下一个事件（精准定位）">▶</button>
      </span>
      <span class="mt-g mt-g-ops">
        <button class="f on" id="yrAll">全部</button>
        <button class="f" id="playBtn">▶ 播放</button>
        <button class="f" id="speedBtn" title="播放速度，点击循环 1×/2×/4×/8×/0.5×/0.1×">1×</button>
        <button class="f" id="keepN" title="连续播放时屏幕保留最近事件数，点击循环 10/5/3/2/1">保留 10 个</button>
      </span>
    </div>
    <div class="mapwrap">
      <div id="map"></div>
      <div class="map-attr" id="mapAttr"></div>
    </div>
  </div>
  <div class="view review" id="view-review" hidden>
    <div class="rv-setup" id="rvSetup">
      <div class="rv-setup-title">复习设置</div>
      <div class="rv-sec">
        <div class="rv-sec-label">第一步 · 史段</div>
        <div class="rv-modes" id="rvSegBtns">
          <button class="rv-mode-btn on" data-seg="ancient"><b>中国古代史</b><span id="rvSegN-ancient"></span></button>
          <button class="rv-mode-btn" data-seg="modern"><b>中国近现代史</b><span id="rvSegN-modern"></span></button>
          <button class="rv-mode-btn" data-seg="world-ancient"><b>世界古代中世纪史</b><span id="rvSegN-world-ancient"></span></button>
          <button class="rv-mode-btn" data-seg="world-modern"><b>世界近现代史</b><span id="rvSegN-world-modern"></span></button>
        </div>
      </div>
      <div class="rv-sec">
        <div class="rv-sec-label">第二步 · 题目范围</div>
        <div class="rv-fg"><span class="glabel">门类</span><span class="rv-btns" id="rvTypeBtns"></span></div>
        <div class="rv-fg"><span class="glabel">等第</span><span class="rv-btns" id="rvImpBtns"></span></div>
        <div class="rv-fg"><span class="glabel">分期</span><span class="rv-btns" id="rvPerBtns"></span></div>
        <div class="rv-fg"><span class="glabel">搜索</span><input type="search" class="search rv-q" id="rvQ" placeholder="关键词…"></div>
      </div>
      <div class="rv-sec">
        <div class="rv-sec-label">第三步 · 题目数量 <span class="rv-count" id="rvCount"></span></div>
        <div class="rv-fg">
          <button class="f on" id="rvAll">全部</button>
          <input type="number" class="rv-num" id="rvNum" min="1" max="99" placeholder="自定义数量">
        </div>
      </div>
      <div class="rv-sec">
        <div class="rv-sec-label">模式</div>
        <div class="rv-modes" id="rvModes">
          <button class="rv-mode-btn on" data-mode="train"><b>针对训练</b><span>按范围抽题 · 记错题 · 自动重练</span></button>
          <button class="rv-mode-btn" data-mode="wrong"><b>巩固错题</b><span>只练历史标记为「忘了」的题</span></button>
          <button class="rv-mode-btn" data-mode="roam"><b>随机漫游</b><span>全库/史段随机抽卡 · 不计错题</span></button>
          <button class="rv-mode-btn" data-mode="quiz"><b>题型专练</b><span>判断题 / 选择题 / 排序题</span></button>
        </div>
        <div class="rv-roam-scope" id="rvRoamScope" hidden>
          <span class="glabel">漫游范围</span>
          <span class="rv-btns" id="rvScopeBtns">
            <button class="f on" data-scope="all">全随机</button>
            <button class="f" data-scope="seg">选史段随机</button>
          </span>
        </div>
        <div class="rv-roam-scope" id="rvQuizSec" hidden>
          <span class="glabel">题型</span>
          <span class="rv-btns" id="rvQuizTypes">
            <button class="f on" data-qz="judge">判断题</button>
            <button class="f" data-qz="choiceA">选择题</button>
            <button class="f" data-qz="sort">排序题</button>
          </span>
        </div>
      </div>
      <div class="rv-warn" id="rvWarn" hidden></div>
      <button class="rv-btn ok rv-start" id="rvStart">开始复习</button>
    </div>
    <div class="rv-head">
      <div class="rv-prog" id="rvProg"></div>
      <div class="rv-fails" id="rvFails"></div>
      <div class="rv-bar"><div class="rv-bar-in" id="rvBarIn"></div></div>
      <button class="rv-exit" id="rvExit" title="退出本轮复习">退出</button>
    </div>
    <div class="rv-stage" id="rvStage">
      <div class="rv-card" id="rvCard">
        <div class="rv-inner" id="rvInner">
          <div class="rv-face front">
            <div class="rv-tags" id="rvFrontTags"></div>
            <div class="rv-title" id="rvTitle"></div>
            <div class="rv-hint">点下方按钮查看答案</div>
          </div>
          <div class="rv-face back">
            <div class="rv-year" id="rvYear"></div>
            <div class="rv-sum" id="rvSum"></div>
            <div class="rv-tip" id="rvTip"></div>
            <div class="rv-kv" id="rvKv"></div>
          </div>
        </div>
      </div>
      <div class="rv-actions">
        <button class="rv-btn fail" id="rvFail" hidden>忘了</button>
        <button class="rv-btn show" id="rvShow">显示答案</button>
        <button class="rv-btn ok" id="rvOk" hidden>记住了</button>
        <button class="rv-btn ok" id="rvNext" hidden>下一张</button>
      </div>
      <div class="rv-quiz" id="rvQuiz" hidden></div>
    </div>
    <div class="rv-done" id="rvDone" hidden>
      <div class="rv-done-title">本轮复习完成</div>
      <div class="rv-done-stat" id="rvDoneStat"></div>
      <button class="rv-btn ok" id="rvAgain">再来一轮</button>
    </div>
  </div>
    <div class="view relation" id="view-relation" hidden>
    <div class="rel-tool">
      <select class="rel-seg" id="relSeg" title="切换关系图谱的史段（不离开图谱视图）">
        <option value="ancient">中国古代史</option>
        <option value="modern">中国近现代史</option>
        <option value="world-ancient">世界古代中世纪史</option>
        <option value="world-modern">世界近现代史</option>
      </select>
      <input type="search" class="search rel-q" id="relQ" placeholder="搜索事件…">
      <button class="f" id="relIso" title="显示/隐藏无关联事件的孤立节点">孤立：隐藏</button>
      <button class="f on" id="relAnim" title="呼吸动画开关：开=节点缓慢自适应排布；关=静止（低配机卡顿保障）">呼吸：开</button>
      <span class="mt-g">
        <button class="f rel-zoom" id="relZoomOut" title="缩小（也可按 - 键）">－</button>
        <button class="f rel-zoom" id="relZoomIn" title="放大（也可按 = 键）">＋</button>
      </span>
      <span class="rel-count" id="relCount"></span>
      <span class="rel-legend" id="relLegend"></span>
    </div>
    <div class="rel-wrap">
      <div id="relCanvas"></div>
      <div class="rel-attr" id="relAttr"></div>
    </div>
    <div class="rel-card" id="relCard" hidden></div>
  </div>
  <div class="view" id="view-parallel" hidden>
    <div id="chart"></div>
    <div id="zoomUI">
      <button id="ptResetBtn" title="回到全览">⟲</button>
      <span class="sep"></span>
      <button id="ptPanL" title="左移">←</button>
      <button id="ptPanR" title="右移">→</button>
      <span class="sep"></span>
      <button id="ptZoomOut" title="缩小">−</button>
      <button id="ptZoomIn" title="放大">＋</button>
      <span class="sep"></span>
      <input id="ptYearInput" type="text" placeholder="年份 · 前221" title="输入年份跳转并显示游标线，如 前221 / 1912 / -221；留空回车清除">
      <button id="ptGoBtn" title="跳转年份并显示游标线">定位</button>
    </div>
  </div>
  <footer>
    据朱绍侯《中国古代史》按章提取 · <span id="footStat"></span> · 年份与等第按教材口径<br>
    记号 ▣ 精确 · ▢ 约年 · ▬ 区间 · ◯ 时代段 · 地图标记按门类分色<br>
    历史是时间的游戏，简洁是智慧的灵魂。
  </footer>
</div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <button class="d-close" id="dClose">收 起</button>
  <div class="d-img-wrap" id="dImgWrap" style="display:none"><img class="d-img" id="dImg" src="" alt=""></div>
  <div class="d-credit" id="dCredit" style="display:none"></div>
  <div class="d-year" id="dYear"></div>
  <div class="d-title" id="dTitle"></div>
  <div class="d-meta" id="dMeta"></div>
  <div class="d-sec"><div class="d-label">概 要</div><div class="d-text" id="dSum"></div></div>
  <div class="d-sec" id="secCau"><div class="d-label">前 因</div><div class="d-text" id="dCau"></div></div>
  <div class="d-sec" id="secEff"><div class="d-label">后 果</div><div class="d-text" id="dEff"></div></div>
  <div class="d-tip"><div class="d-label">备 考 钩</div><div class="d-text" id="dTip"></div></div>
  <div class="d-sec" id="secPpl"><div class="d-label">人 物</div><div class="d-kv" id="dPpl"></div></div>
  <div class="d-sec" id="secLoc"><div class="d-label">地 点</div><div class="d-kv" id="dLoc"></div></div>
  <div class="d-sec" id="secTag"><div class="d-label">标 签</div><div class="d-kv" id="dTag"></div></div>
  <div class="d-sec" id="secRel"><div class="d-label">关 联</div><div class="relchips" id="dRel"></div></div>
  <div class="src" id="dSrc"></div>
  <div class="drawer-edit" id="drawerEdit" hidden>
    <button class="f" id="dEdit">✎ 编辑事件</button>
    <button class="f del" id="dDel">✕ 删除事件</button>
  </div>
</aside>
<div class="overlay" id="overlay" hidden></div>
<button class="to-band" id="toBand" title="回到当前章节标题" hidden>↑</button>
<button class="to-band" id="toNextBand" title="跳到下一章标题" hidden>↓</button>

<!-- 编辑事件 modal（本地服务 http:// 下可用） -->
<div class="modal" id="editModal" hidden>
  <div class="modal-box">
    <div class="modal-title" id="mTitle">编辑事件</div>
    <div class="modal-body">
      <label class="mf"><span>章节（新增时）</span><select id="fTag"></select></label>
      <label class="mf"><span>标题 *</span><input id="fTitle"></label>
      <label class="mf"><span>年份模式</span><select id="fYearMode">
        <option value="exact">exact 精确年</option><option value="approx">approx 约年</option>
        <option value="range">range 起止区间</option><option value="era">era 时代段</option>
      </select></label>
      <label class="mf"><span>年份（公元前负，如 -632）</span><input id="fYear" type="number"></label>
      <label class="mf"><span>起止区间（逗号分隔，如 -551,-479 / 1219,1224）</span><input id="fYearRange" disabled></label>
      <label class="mf"><span>时代段名（era 必填，如 旧石器时代早期）</span><input id="fEra" disabled></label>
      <label class="mf"><span>时代副句（eraSub，如 距今约170万年）</span><input id="fEraSub" disabled></label>
      <label class="mf"><span>朝代</span><input id="fDynasty"></label>
      <label class="mf"><span>大分期（先秦/秦汉/魏晋南北朝/隋唐/宋元/明清）</span><input id="fPeriod"></label>
      <label class="mf"><span>门类（政治/军事/经济/文化/制度/民族关系/对外关系）</span><input id="fType"></label>
      <label class="mf"><span>重要性</span><select id="fImp"><option value="3">3 核心考点</option><option value="2">2 常考</option><option value="1">1 了解</option></select></label>
      <label class="mf"><span>摘要（学术腔，2-3 句）</span><textarea id="fSum" rows="3"></textarea></label>
      <label class="mf"><span>前因</span><textarea id="fCause" rows="2"></textarea></label>
      <label class="mf"><span>后果</span><textarea id="fEffect" rows="2"></textarea></label>
      <label class="mf"><span>考点提示（口语腔）</span><textarea id="fTip" rows="2"></textarea></label>
      <label class="mf"><span>人物（顿号分隔）</span><input id="fPpl"></label>
      <label class="mf"><span>地点（古名（今址））</span><input id="fLoc"></label>
      <label class="mf"><span>标签（顿号分隔）</span><input id="fTags"></label>
      <label class="mf"><span>关联事件（顿号分隔，须为已有 title）</span><input id="fRel"></label>
      <label class="mf"><span>wikiSlug（留空自动=标题）</span><input id="fSlug"></label>
    </div>
    <div class="modal-actions">
      <button class="f" id="mCancel">取消</button>
      <button class="f ok" id="mSave">保存</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js" integrity="sha384-eXVCORTRlv4FUUgS/xmOyr66XBVraen8ATNLMESp92FKXLAMiKkerixTiBvXriZr" crossorigin="anonymous"></script>
<script src="js/data.js"></script>
<script src="data/quiz_chains.js"></script>
<script src="data/borders.js"></script>
<script src="js/common.js"></script>
<script src="js/timeline.js"></script>
<script src="js/map.js"></script>
<script src="js/review.js"></script>
<script src="js/quiz.js"></script>
<script src="js/app.js"></script>
<script src="js/relation.js"></script>
<script src="js/edit.js"></script>
<script src="parallel/echarts.min.js"></script>
<script src="js/parallel.js"></script>
</body>
</html>
