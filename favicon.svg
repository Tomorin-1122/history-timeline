<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 底：墨褐（沉稳，替代鲜艳朱砂） -->
  <rect width="64" height="64" rx="14" fill="#3f322b"/>
  <!-- 晷盘：宣纸米黄（与站点底色统一） -->
  <circle cx="32" cy="32" r="23" fill="#f5f1e6"/>
  <!-- 主刻度：十字（暗赭，压过原朱砂的鲜艳度） -->
  <g stroke="#8a4b34" stroke-width="3.4" stroke-linecap="round">
    <line x1="32" y1="13.5" x2="32" y2="19.5"/>
    <line x1="32" y1="44.5" x2="32" y2="50.5"/>
    <line x1="13.5" y1="32" x2="19.5" y2="32"/>
    <line x1="44.5" y1="32" x2="50.5" y2="32"/>
  </g>
  <!-- 副刻度：对角（半透明） -->
  <g stroke="#8a4b34" stroke-width="2.2" stroke-linecap="round" opacity="0.5">
    <line x1="21.5" y1="21.5" x2="25.5" y2="25.5"/>
    <line x1="42.5" y1="21.5" x2="38.5" y2="25.5"/>
    <line x1="42.5" y1="42.5" x2="38.5" y2="38.5"/>
    <line x1="21.5" y1="42.5" x2="25.5" y2="38.5"/>
  </g>
  <!-- 晷针：三角指针 -->
  <polygon points="32,24 28.6,40.5 35.4,40.5" fill="#8a4b34"/>
  <!-- 轴心 -->
  <circle cx="32" cy="40.5" r="3.2" fill="#8a4b34"/>
</svg>
