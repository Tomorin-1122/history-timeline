<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国古代史时间轴 · 打样</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/900.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --paper:#f5f1e6; --paper2:#faf7ee; --paper-dim:#efe9da;
  --ink:#2e2a23; --ink2:#5c554a; --ink3:#8a8072;
  --cin:#9e3d26; --cin-soft:#f4e9e3;
  --line:#ddd3bf; --line2:#c9bda2;
  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--serif); font-size:16px; line-height:1.9;
}
body::after{
  content:""; position:fixed; inset:0; z-index:80; pointer-events:none;
  background-image:
    repeating-linear-gradient(0deg, rgba(60,50,35,.018) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, rgba(60,50,35,.014) 0 1px, transparent 1px 4px);
}
@media (prefers-reduced-motion: no-preference){
  html{scroll-behavior:smooth}
  .drawer{transition:transform .3s cubic-bezier(.2,.75,.25,1)}
  .flash .body{animation:flashbg 1.4s ease-out}
}
@keyframes flashbg{0%{background:#efe2c8}100%{background:transparent}}
.band.flash{animation:flashbg 1.4s ease-out}
.wrap{max-width:940px;margin:0 auto;padding:0 28px 110px}
.topbar{
  position:sticky; top:0; left:0; right:0; z-index:60;
  background:var(--paper); border-bottom:1px solid var(--line);
  box-shadow:0 2px 14px rgba(46,42,35,.06);
}
.tb-inner{max-width:940px;margin:0 auto;padding:0 28px}
.tb-row1{display:flex;align-items:center;gap:16px;padding:10px 0 6px;flex-wrap:wrap}
h1{font-size:20px;font-weight:900;letter-spacing:.06em}
.tb-tabs{display:flex;gap:2px;margin-left:auto}
.tb-tabs .tab{
  font-family:var(--serif); font-size:14px; letter-spacing:.12em; cursor:pointer;
  background:none; border:none; border-bottom:2px solid transparent;
  color:var(--ink2); padding:4px 14px 6px;
}
.tb-tabs .tab:hover{color:var(--cin)}
.tb-tabs .tab.on{color:var(--cin); border-bottom-color:var(--cin); font-weight:700}
.bar{
  border-top:1px solid var(--line);
  padding:8px 0 10px; display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; font-size:13.5px;
}
.search{
  font-family:var(--serif); font-size:13px; flex:1; min-width:180px;
  background:var(--paper2); border:1px solid var(--line2); color:var(--ink);
  padding:4px 10px; outline:none;
}
.search:focus{border-color:var(--cin)}
.filters{
  flex-basis:100%; display:flex; flex-direction:column; gap:8px;
  padding:8px 0 2px; border-top:1px dashed var(--line); margin-top:2px;
}
.filters[hidden]{display:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  display:inline-flex;align-items:center;gap:4px;font-size:12px;
  background:var(--cin-soft);border:1px solid var(--cin);color:var(--cin);padding:1px 4px 1px 8px;
}
.chip .x{background:none;border:none;color:var(--cin);cursor:pointer;font-size:13px;line-height:1;padding:0 2px;font-family:var(--serif)}
.chip .x:hover{color:var(--ink)}
.to-band{
  position:fixed; right:26px; bottom:26px; z-index:70;
  width:42px; height:42px; border-radius:50%;
  background:var(--paper2); border:1px solid var(--line2); color:var(--cin);
  font-size:20px; line-height:1; cursor:pointer; font-family:var(--serif);
  box-shadow:0 3px 12px rgba(46,42,35,.16);
}
.to-band:hover{background:var(--cin);color:var(--paper2);border-color:var(--cin)}
.group{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.glabel{color:var(--ink3);letter-spacing:.2em;margin-right:4px;font-size:12.5px}
button.f{
  font-family:var(--serif); font-size:13.5px; background:none; cursor:pointer;
  border:1px solid transparent; color:var(--ink2); padding:1px 8px; line-height:1.8;
}
button.f:hover{color:var(--cin)}
button.f.on{background:var(--cin); color:var(--paper2); border-color:var(--cin)}
a.jump{color:var(--ink2); text-decoration:none; border-bottom:1px solid var(--line2); padding-bottom:1px}
a.jump:hover{color:var(--cin); border-color:var(--cin)}
.bar .cnt{margin-left:auto; color:var(--ink3); font-size:12.5px}
.band{margin:46px 0 2px; display:flex; align-items:center; gap:14px; scroll-margin-top:112px}
.band .sq{width:9px; height:9px; background:var(--cin); flex:none}
.band .no{font-size:12px; letter-spacing:.3em; color:var(--cin); flex:none}
.band h2{font-size:21px; font-weight:900; letter-spacing:.08em; flex:none}
.band .note{font-size:12.5px; color:var(--ink3); flex:none}
.band .rule{flex:1; height:1px; background:var(--line)}
.row{display:grid; grid-template-columns:8.5rem 1fr; cursor:pointer}
.row:hover .body{background:var(--paper-dim)}
.year{
  padding:22px 1.4rem 22px 0; text-align:right;
  font-size:14px; color:var(--ink2); line-height:1.7;
  border-bottom:1px solid var(--line);
  font-variant-numeric:tabular-nums;
}
.year .era{display:block; color:var(--ink3); font-size:12.5px; line-height:1.65}
.body{
  position:relative; border-left:1px solid var(--line);
  padding:20px 0 20px 1.6rem; border-bottom:1px solid var(--line);
}
.body::before{
  content:""; position:absolute; left:0; top:27px; transform:translateX(-50%);
  width:7px; height:7px; background:var(--paper); border:1px solid var(--ink3);
}
.row.exact .body::before{background:var(--cin); border-color:var(--cin)}
.row.era .body::before{border-radius:50%; background:var(--paper)}
.row.approx .body::before{border-style:dashed; background:var(--paper)}
.row.range .body::before{height:17px; width:5px; top:22px; border-color:var(--cin)}
.title-row{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
h3{font-size:17.5px; font-weight:700}
.stars{font-size:12px; letter-spacing:2px; color:var(--cin); flex:none}
.stars .off{color:#cfc4ab}
.tag{font-size:11.5px; color:var(--ink2); border:1px solid var(--line2); padding:0 6px; line-height:1.8; flex:none}
.summary{margin-top:3px; color:var(--ink2); font-size:14.5px; max-width:70ch; line-height:1.85}
.drawer{
  position:fixed; top:0; right:0; height:100dvh; width:min(430px,94vw);
  background:var(--paper2); border-left:1px solid var(--line2);
  box-shadow:-16px 0 40px rgba(46,42,35,.10);
  transform:translateX(105%); z-index:90; overflow-y:auto;
  padding:24px 26px 64px;
}
.drawer.open{transform:none}
.d-close{background:none; border:none; font-family:var(--serif); font-size:13px; color:var(--ink3); cursor:pointer; letter-spacing:.2em; padding:0}
.d-close:hover{color:var(--cin)}
.d-year{margin-top:20px; font-size:15px; color:var(--cin); letter-spacing:.05em}
.d-title{font-size:25px; font-weight:900; margin-top:4px; letter-spacing:.04em}
.d-meta{display:flex; gap:6px; flex-wrap:wrap; margin-top:12px; align-items:center}
.d-sec{margin-top:22px}
.d-label{font-size:12px; letter-spacing:.3em; color:var(--ink3); margin-bottom:5px}
.d-text{font-size:14.5px; line-height:1.9}
.d-kv{font-size:14px; color:var(--ink2); line-height:1.9}
.d-tip{margin-top:24px; border-left:3px solid var(--cin); background:var(--cin-soft); padding:12px 14px}
.d-tip .d-label{color:var(--cin)}
.relchips{display:flex; flex-wrap:wrap; gap:6px}
.relchips button{
  font-family:var(--serif); font-size:13px; background:none; cursor:pointer;
  border:1px solid var(--line2); color:var(--ink2); padding:2px 10px; line-height:1.8;
}
.relchips button:hover{color:var(--cin); border-color:var(--cin)}
.src{margin-top:26px; padding-top:14px; border-top:1px solid var(--line); font-size:12.5px; color:var(--ink3)}
.empty{padding:64px 0; text-align:center; color:var(--ink3); font-size:14px; letter-spacing:.1em}
.view[hidden]{display:none}
.view.review{padding-top:24px}
.rv-setup{max-width:560px;margin:0 auto}
.rv-setup-title{font-size:22px;font-weight:900;letter-spacing:.12em;text-align:center;margin-bottom:18px}
.rv-sec{border:1px solid var(--line);background:var(--paper2);padding:14px 18px;margin-bottom:14px}
.rv-sec-label{font-size:12px;letter-spacing:.3em;color:var(--ink3);margin-bottom:10px}
.rv-fg{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.rv-fg:last-child{margin-bottom:0}
.rv-btns{display:flex;gap:4px;flex-wrap:wrap}
.rv-q{flex:1;min-width:140px}
.rv-num{width:96px;font-family:var(--serif);font-size:13px;padding:4px 8px;border:1px solid var(--line2);background:var(--paper);color:var(--ink)}
.rv-modes{display:flex;flex-direction:column;gap:8px}
.rv-mode-btn{font-family:var(--serif);text-align:left;cursor:pointer;border:1px solid var(--line2);background:var(--paper);color:var(--ink2);padding:10px 14px}
.rv-mode-btn b{font-size:14.5px;letter-spacing:.06em;display:block}
.rv-mode-btn span{font-size:12px;color:var(--ink3);display:block;margin-top:2px}
.rv-mode-btn.on{border-color:var(--cin);background:var(--cin-soft);color:var(--cin)}
.rv-mode-btn.on span{color:var(--cin)}
.rv-start{display:block;margin:4px auto 0;min-width:200px}
.rv-warn{max-width:560px;margin:10px auto 0;color:var(--cin);font-size:13.5px;text-align:center}
.rv-head{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:14px;font-size:13px;color:var(--ink3)}
.rv-prog{flex:none}
.rv-fails{flex:none;color:var(--cin)}
.rv-bar{flex:1;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.rv-bar-in{height:100%;width:0;background:var(--cin);transition:width .3s}
.rv-exit{flex:none;font-family:var(--serif);font-size:12px;letter-spacing:.1em;cursor:pointer;border:1px solid var(--line2);background:none;color:var(--ink3);padding:3px 12px;margin-left:auto}
.rv-exit:hover{color:var(--cin);border-color:var(--cin)}
.rv-exit.armed{background:var(--cin);color:var(--paper2);border-color:var(--cin)}
.rv-stage{max-width:520px;margin:22px auto 0}
.rv-card{perspective:1200px}
.rv-inner{position:relative;transition:transform .5s cubic-bezier(.2,.75,.25,1);transform-style:preserve-3d;min-height:350px}
.rv-card.flip .rv-inner{transform:rotateY(180deg)}
.rv-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--paper2);border:1px solid var(--line2);box-shadow:0 6px 24px rgba(46,42,35,.08);padding:38px 34px;display:flex;flex-direction:column}
.rv-face.front{justify-content:center;align-items:center;text-align:center}
.rv-face.back{transform:rotateY(180deg);overflow-y:auto}
.rv-tags{display:flex;gap:8px;align-items:center;justify-content:center;margin-bottom:18px}
.rv-title{font-size:30px;font-weight:900;letter-spacing:.05em;line-height:1.4}
.rv-hint{margin-top:26px;font-size:12.5px;color:var(--ink3);letter-spacing:.18em}
.rv-year{font-size:26px;font-weight:900;color:var(--cin);letter-spacing:.04em}
.rv-sum{margin-top:14px;font-size:14.5px;line-height:1.9;color:var(--ink2)}
.rv-tip{margin-top:16px;border-left:3px solid var(--cin);background:var(--cin-soft);padding:10px 14px;font-size:13.5px;line-height:1.8}
.rv-kv{margin-top:16px;font-size:13px;color:var(--ink3);line-height:1.8}
.rv-actions{display:flex;gap:12px;justify-content:center;margin-top:20px}
.rv-btn{font-family:var(--serif);font-size:14px;letter-spacing:.12em;cursor:pointer;padding:8px 26px;border:1px solid var(--line2);background:var(--paper2);color:var(--ink2)}
.rv-btn:hover{border-color:var(--cin);color:var(--cin)}
.rv-btn.ok{background:var(--cin);color:var(--paper2);border-color:var(--cin)}
.rv-btn.ok:hover{opacity:.9;color:var(--paper2)}
.rv-btn.fail{color:var(--ink3)}
.rv-btn.show{min-width:180px}
.rv-done{max-width:520px;margin:60px auto 0;text-align:center;background:var(--paper2);border:1px solid var(--line2);padding:48px 34px}
.rv-done-title{font-size:26px;font-weight:900;letter-spacing:.1em}
.rv-done-stat{margin:14px 0 26px;font-size:14px;color:var(--ink2);line-height:1.8}
.mapview{padding-top:20px}
.maptool{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 14px;border:1px solid var(--line);background:var(--paper2);font-size:13px}
.maptool input[type=range]{flex:1;min-width:160px;accent-color:var(--cin)}
.maptool .yrlabel{font-variant-numeric:tabular-nums;min-width:96px;color:var(--cin);font-size:14px;letter-spacing:.04em}
.mapwrap{position:relative}
#map{height:calc(100dvh - 226px);min-height:420px;border:1px solid var(--line);margin-top:10px;background:#e8e2d2}
footer .fg{display:inline-flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 2px}
footer .fg-i{display:inline-flex;align-items:center;gap:4px}
footer .fg-i::before{content:"";width:8px;height:8px;border-radius:50%}
footer .fg-i[data-c="政治"]::before{background:#9e3d26}
footer .fg-i[data-c="军事"]::before{background:#37474f}
footer .fg-i[data-c="经济"]::before{background:#4f6d3a}
footer .fg-i[data-c="文化"]::before{background:#3d5a80}
footer .fg-i[data-c="制度"]::before{background:#8a6d2c}
.leaflet-container{background:#e8e2d2;font-family:var(--serif)}
.leaflet-popup-content-wrapper{background:var(--paper2);color:var(--ink);border:1px solid var(--line2);border-radius:2px;font-family:var(--serif);box-shadow:0 4px 18px rgba(46,42,35,.14)}
.leaflet-popup-content{margin:12px 16px;line-height:1.7}
.leaflet-popup-tip{background:var(--paper2);border:1px solid var(--line2)}
.mp-t{font-size:16px;font-weight:700;letter-spacing:.04em}
.mp-y{font-size:12.5px;color:var(--cin);margin-top:2px;letter-spacing:.05em}
.mp-s{font-size:13px;color:var(--ink2);margin-top:6px;max-width:280px;line-height:1.8}
.mp-label{background:var(--paper2);color:var(--ink);border:1px solid var(--line2);border-radius:2px;font-size:12px;font-family:var(--serif);padding:1px 7px;box-shadow:0 1px 4px rgba(46,42,35,.12)}
.mp-label::before{display:none}
.overlay{position:fixed;inset:0;z-index:85;background:rgba(46,42,35,.22)}
footer{margin-top:70px; font-size:12.5px; color:var(--ink3); line-height:1.8; border-top:1px solid var(--line); padding-top:16px}
@media (max-width:760px){
  .wrap{padding:0 18px 80px}
  .tb-inner{padding:0 18px}
  h1{font-size:18px}
  .row{grid-template-columns:1fr}
  .year{text-align:left; padding:14px 0 0; border-bottom:none}
  .year .era{display:inline; margin-left:8px}
  .body{border-left:none; padding:2px 0 18px}
  .body::before{display:none}
  #map{height:calc(100dvh - 262px);min-height:340px}
  .to-band{right:16px;bottom:16px;width:38px;height:38px;font-size:17px}
  .rv-face{padding:26px 20px}
  .rv-title{font-size:24px}
  .rv-stage{max-width:100%}
  .rv-inner{min-height:320px}
}
</style>
</head>
<body>
<div class="topbar" id="topbar">
  <div class="tb-inner">
    <div class="tb-row1">
      <h1>中国古代史时间轴</h1>
      <div class="tb-tabs" id="viewTabs">
        <button class="tab on" data-view="timeline">时间轴</button>
        <button class="tab" data-view="map">地图</button>
        <button class="tab" data-view="review">复习</button>
      </div>
    </div>
    <div class="bar" id="bar">
      <input type="search" class="search" id="q" placeholder="搜索事件…">
      <button class="f toggle" id="filterToggle" title="展开/收起筛选">筛选</button>
      <span class="chips" id="chips"></span>
      <span class="cnt" id="cnt"></span>
      <div class="filters" id="filters" hidden>
        <span class="group">
          <span class="glabel">分期</span>
          <a class="jump" href="#c1">原始社会</a>
          <a class="jump" href="#c4">春秋</a>
        </span>
        <span class="group" id="typeGroup">
          <span class="glabel">门类</span>
        </span>
        <span class="group" id="impGroup">
          <span class="glabel">等第</span>
        </span>
      </div>
    </div>
  </div>
</div>
<div class="wrap">
  <div class="view" id="view-timeline">
    <main id="main"></main>
    <div class="empty" id="empty" hidden>当前筛选下没有事件。</div>
  </div>
  <div class="view mapview" id="view-map" hidden>
    <div class="maptool">
      <span class="yrlabel" id="yrLabel">全部年份</span>
      <input type="range" id="yrSlider" min="-770" max="-473" step="1" value="-770" aria-label="年代">
      <button class="f on" id="yrAll">全部</button>
      <button class="f" id="playBtn">▶ 播放</button>
    </div>
    <div class="mapwrap">
      <div id="map"></div>
    </div>
  </div>
  <div class="view review" id="view-review" hidden>
    <div class="rv-setup" id="rvSetup">
      <div class="rv-setup-title">复习设置</div>
      <div class="rv-sec">
        <div class="rv-sec-label">题目范围</div>
        <div class="rv-fg"><span class="glabel">门类</span><span class="rv-btns" id="rvTypeBtns"></span></div>
        <div class="rv-fg"><span class="glabel">等第</span><span class="rv-btns" id="rvImpBtns"></span></div>
        <div class="rv-fg"><span class="glabel">分期</span><span class="rv-btns" id="rvPerBtns"></span></div>
        <div class="rv-fg"><span class="glabel">搜索</span><input type="search" class="search rv-q" id="rvQ" placeholder="关键词…"></div>
      </div>
      <div class="rv-sec">
        <div class="rv-sec-label">题目数量 <span class="rv-count" id="rvCount"></span></div>
        <div class="rv-fg">
          <button class="f on" id="rvAll">全部</button>
          <input type="number" class="rv-num" id="rvNum" min="1" max="99" placeholder="自定义数量">
        </div>
      </div>
      <div class="rv-sec">
        <div class="rv-sec-label">模式</div>
        <div class="rv-modes" id="rvModes">
          <button class="rv-mode-btn on" data-mode="train"><b>针对训练</b><span>按范围抽题 · 记错题 · 自动重练</span></button>
          <button class="rv-mode-btn" data-mode="wrong"><b>巩固错题</b><span>只练历史标记为「忘了」的题</span></button>
          <button class="rv-mode-btn" data-mode="roam"><b>随机漫游</b><span>全库随机抽卡 · 不计错题</span></button>
        </div>
      </div>
      <div class="rv-warn" id="rvWarn" hidden></div>
      <button class="rv-btn ok rv-start" id="rvStart">开始复习</button>
    </div>
    <div class="rv-head">
      <div class="rv-prog" id="rvProg"></div>
      <div class="rv-fails" id="rvFails"></div>
      <div class="rv-bar"><div class="rv-bar-in" id="rvBarIn"></div></div>
      <button class="rv-exit" id="rvExit" title="退出本轮复习">退出</button>
    </div>
    <div class="rv-stage" id="rvStage">
      <div class="rv-card" id="rvCard">
        <div class="rv-inner" id="rvInner">
          <div class="rv-face front">
            <div class="rv-tags" id="rvFrontTags"></div>
            <div class="rv-title" id="rvTitle"></div>
            <div class="rv-hint">点下方按钮查看答案</div>
          </div>
          <div class="rv-face back">
            <div class="rv-year" id="rvYear"></div>
            <div class="rv-sum" id="rvSum"></div>
            <div class="rv-tip" id="rvTip"></div>
            <div class="rv-kv" id="rvKv"></div>
          </div>
        </div>
      </div>
      <div class="rv-actions">
        <button class="rv-btn fail" id="rvFail" hidden>忘了</button>
        <button class="rv-btn show" id="rvShow">显示答案</button>
        <button class="rv-btn ok" id="rvOk" hidden>记住了</button>
        <button class="rv-btn ok" id="rvNext" hidden>下一张</button>
      </div>
    </div>
    <div class="rv-done" id="rvDone" hidden>
      <div class="rv-done-title">本轮复习完成</div>
      <div class="rv-done-stat" id="rvDoneStat"></div>

{ch:0,t:"北京人",y:null,m:"era",era:"旧石器时代早期",eraSub:"距今约69万年",dyn:"原始社会",per:"先秦",type:"文化",imp:2,

 cau:"",eff:"用火遗迹与大量石器为研究早期人类生活提供关键证据，印证了「劳动创造了人本身」的论断。",
 tip:"北京人用的是天然火，会保存火种；「人工取火」是山顶洞人的功劳，选择题年年在这挖坑。",

{ch:0,t:"山顶洞人",y:null,m:"era",era:"旧石器时代晚期",eraSub:"距今约3万年",dyn:"原始社会",per:"先秦",type:"文化",imp:1,

{ch:0,t:"仰韶文化",y:null,m:"era",era:"新石器时代",eraSub:"距今约7000至5000年",dyn:"原始社会",per:"先秦",type:"文化",imp:2,
 sum:"分布于黄河中游，距今约7000至5000年，以磨制石器、彩陶与粟作农业为特征，半坡遗址的半地穴式房屋为其代表；其时母系氏族公社进入繁荣阶段。",
 cau:"",eff:"展现了母系氏族社会繁荣期的经济生活图景，原始农业、制陶、纺织均有相当发展。",
 tip:"黄河仰韶种粟、长江河姆渡种稻，南北千万别互换；彩陶归仰韶，黑陶归龙山。",

{ch:0,t:"河姆渡文化",y:null,m:"era",era:"新石器时代",eraSub:"距今约7000年",dyn:"原始社会",per:"先秦",type:"经济",imp:2,
 sum:"发现于浙江余姚，距今约7000年，是长江流域稻作农业的代表；出土大量稻谷遗存与骨耜，住干栏式房屋，已会凿井。",
 cau:"",eff:"证明长江流域与黄河流域同为中华文明的重要发源地。",

{ch:0,t:"大汶口文化",y:null,m:"era",era:"新石器时代",eraSub:"距今约6000至4500年",dyn:"原始社会",per:"先秦",type:"文化",imp:1,

 cau:"",eff:"为研究私有制起源与氏族社会解体提供了典型材料。",
 tip:"题干说「随葬品悬殊」「贫富分化」，答父系氏族，大汶口是最常用的例子。",

{ch:0,t:"龙山文化",y:null,m:"era",era:"新石器时代",eraSub:"距今约5000至4000年",dyn:"原始社会",per:"先秦",type:"文化",imp:2,

 cau:"",eff:"城址与贫富墓制的出现，预示国家雏形正在孕育。",

 sum:"分布于长江下游太湖流域，距今约5300至4300年；以琮、璧等玉礼器、大型城址与外围水利系统为标志，社会分层明显，已具早期国家形态。",

{ch:0,t:"尧舜禹禅让",y:null,m:"era",era:"传说时代",eraSub:"原始社会末期",dyn:"原始社会",per:"先秦",type:"制度",imp:2,
 sum:"部落联盟时期，联盟首领经推举与考察相继传位于贤能，史称禅让；尧传舜、舜传禹为其典型，反映原始民主制的遗存。",
 cau:"氏族公社之下公有制的经济基础，决定了首领权力的公共属性。",

 tip:"禅让是「传贤」，世袭是「传子」；禹传启一刀切断，出题就考这个转折点。",

{ch:0,t:"禹传启家天下",y:-2070,m:"approx",era:"",eraSub:"",dyn:"原始社会",per:"先秦",type:"制度",imp:3,
 sum:"约前2070年，禹建立夏朝；禹死后其子启袭位，世袭制代替禅让制，「公天下」变为「家天下」，原始社会告终，阶级社会开始。",

{ch:1,t:"周平王东迁洛邑",y:-770,m:"exact",era:"",eraSub:"",dyn:"春秋",per:"先秦",type:"政治",imp:3,

 cau:"犬戎攻破镐京，宗周残破，平王无力在旧都立足。",
 eff:"周天子权威一落千丈，诸侯坐大，拉开大国争霸的序幕。",
 tip:"东周分两截：春秋与战国。始年是前770平王东迁；被杀的那位是幽王，「烽火戏诸侯」的锅是他的。",

{ch:1,t:"铁器与牛耕的推广",y:null,m:"era",era:"春秋时期",eraSub:"生产力之变",dyn:"春秋",per:"先秦",type:"经济",imp:3,
 sum:"春秋时期铁制农具开始使用并逐步推广，牛耕随之出现；深耕细作成为可能，大量荒地被辟为私田，是社会生产力发展的划时代标志。",
 cau:"冶铁技术的进步为农具革新提供了物质条件。",
 eff:"井田制因之瓦解，赋税改革、阶级变动与思想争鸣皆由此引出，是春秋大变革的总根源。",
 tip:"论述题的总开关：凡问春秋为何大变，先答铁器牛耕，再顺出井田瓦解、初税亩、百家争鸣。",

{ch:1,t:"管仲相齐",y:-685,m:"exact",era:"",eraSub:"",dyn:"春秋",per:"先秦",type:"制度",imp:2,
 sum:"前685年，齐桓公即位，任管仲为相；管仲对内整顿行政与军制，经济上「相地而衰征」，按土地肥瘠定赋税轻重，齐国力大增。",
 cau:"齐桓公欲图霸业，需先富国强兵。",

 tip:"「相地而衰征」是齐国管仲的，和鲁国初税亩分开记：一个看地好坏收税，一个公私田一律收。",

 cau:"齐国经管仲改革国富兵强，又以尊王攘夷赢得政治声望。",
 eff:"确立了霸主代行天子征伐、会盟之权的政治惯例。",

{ch:1,t:"作爰田",y:-645,m:"exact",era:"",eraSub:"",dyn:"春秋",per:"先秦",type:"制度",imp:1,

 cau:"韩原之战晋败于秦，晋惠公被俘归国前后急需安定内部。",
 eff:"与管仲「相地而衰征」、鲁「初税亩」同属井田制瓦解过程中的田制变革。",

{ch:1,t:"城濮之战",y:-632,m:"exact",era:"",eraSub:"",dyn:"春秋",per:"先秦",type:"军事",imp:3,
 sum:"前632年，晋楚战于城濮。晋文公诱敌深入、各个击破，以少胜多大败楚军；战后践土会盟，周襄王策命晋文公为侯伯，晋国霸权确立。",
 cau:"楚国北进争中原，宋国叛楚附晋，晋为救宋与楚决战。",
 eff:"中原小国摆脱楚之控制归附于晋，晋文公成为继齐桓公之后又一代霸主。",
 tip:"「退避三舍」出于此战，一舍三十里；对阵双方是晋楚，赢家是晋，别与崤之战颠倒。",
 ppl:["晋文公","楚成王"],loc:"城濮（今山东鄄城西南）",tags:["以少胜多","晋楚争霸"],rel:["葵丘会盟","崤之战","邲之战"],slug:"城濮之战"},
{ch:1,t:"崤之战",y:-627,m:"exact",era:"",eraSub:"",dyn:"春秋",per:"先秦",type:"军事",imp:2,
 sum:"前627年，秦军千里袭郑未果，回师至崤山遭晋军伏击，全军覆没，孟明视等三帅被俘；秦国东进之势自此受挫。",
 cau:"秦穆公乘晋文公新丧，欲东出争利。",
 eff:"秦晋由联盟转为世仇，秦转而向西发展，遂霸西戎。",
 tip:"弦高犒师就发生在秦军袭郑途中；崤之战秦国输得极惨，别记成秦胜。",
 ppl:["秦穆公","晋襄公"],loc:"崤山（今河南渑池一带）",tags:["伏击","秦晋交恶"],rel:["城濮之战","楚庄王问鼎中原"],slug:""},
{ch:1,t:"楚庄王问鼎中原",y:-606,m:"exact",era:"",eraSub:"",dyn:"春秋",per:"先秦",type:"政治",imp:2,
 sum:"前606年，楚庄王伐陆浑之戎，陈兵于周王室境内，遣使问九鼎之大小轻重，意在窥伺周室。",
 cau:"楚国长期经营南方后国势强盛，不甘久居蛮夷之位。",
 eff:"「问鼎」成为觊觎最高权力的代称，楚庄王随即北上争霸，终成一代霸主。",

 ppl:["楚庄王","王孙满"],loc:"洛邑近郊",tags:["问鼎","楚"],rel:["邲之战","崤之战"],slug:""},
{ch:1,t:"邲之战",y:-597,m:"exact",era:"",eraSub:"",dyn:"春秋",per:"先秦",type:"军事",imp:1,
 sum:"前597年，晋楚战于邲，晋军将帅不和、指挥失据而大败，楚庄王由此确立霸权。",
 cau:"楚围郑，晋出兵救郑，两军遇于邲。",
 eff:"楚国饮马黄河，中原诸侯多附于楚。",
 tip:"城濮晋胜、邲楚胜，一前一后正好互换；记「晋文公赢城濮，楚庄王赢邲」。",

{ch:1,t:"初税亩",y:-594,m:"exact",era:"",eraSub:"",dyn:"春秋",per:"先秦",type:"制度",imp:3,
 sum:"前594年，鲁国实行初税亩，无论公田私田，一律按亩征税；此举从法律上承认了土地私有，是井田制瓦解的标志性事件。",
 cau:"私田大量开垦而旧税制不及，鲁国财政所迫不得不改。",
 eff:"加速井田制崩溃，封建土地私有关系由此获得合法身份。",
 tip:"「初」者始也。性质大于内容：承认土地私有合法。春秋赋税改革里它的分量最重。",

function fmt(e){
  if(e.m==="era") return null;
  if(e.m==="range") return "前 "+(-e.yr[0])+" 至 "+(-e.yr[1]);
  const abs=e.y<0?("前 "+(-e.y)):(""+e.y);
  return (e.m==="approx"?"约":"")+abs;
}
function fmtShort(e){
  if(e.m==="era") return e.era;
  if(e.m==="range") return "前 "+(-e.yr[0])+"~"+(-e.yr[1]);
  const abs=e.y<0?("前 "+(-e.y)):(""+e.y);
  return (e.m==="approx"?"约":"")+abs;
}
function stars(n){
  let s="";
  for(let i=1;i<=3;i++) s+= i<=n ? "★" : '<span class="off">★</span>';
  return s;
}

function mkBtns(groupId,items,key,render){
  const g=document.getElementById(groupId);
  items.forEach(it=>{
    const label=render?it[0]:it, val=render?it[1]:it;
    const b=document.createElement("button");
    b.className="f"+(state[key]===val?" on":""); b.textContent=label;
    b.addEventListener("click",()=>{state[key]=val;
      g.querySelectorAll("button.f").forEach(x=>x.classList.remove("on"));
      b.classList.add("on"); renderChips(); applyFilter();});
    g.appendChild(b);
  });
}

function renderChips(){
  const c=document.getElementById("chips"); c.innerHTML="";
  const items=[];
  if(state.type!=="全部") items.push({k:"type",v:state.type});
  if(state.imp!==0) items.push({k:"imp",v:state.imp===3?"★★★":(state.imp===2?"★★":"★")});
  if(state.q) items.push({k:"q",v:'"'+state.q+'"'});
  items.forEach(it=>{
    const s=document.createElement("span");
    s.className="chip";
    s.innerHTML=it.v+'<button class="x" data-k="'+it.k+'">×</button>';
    s.querySelector(".x").addEventListener("click",()=>{
      if(it.k==="type"){state.type="全部";setBtn("typeGroup",0);}
      else if(it.k==="imp"){state.imp=0;setBtn("impGroup",0);}
      else if(it.k==="q"){state.q="";qInput.value="";}
      renderChips();applyFilter();
    });
    c.appendChild(s);
  });
}

function matchEvent(e,q){
  const hay=[e.t,e.sum||"",e.loc||"",e.tip||"",(e.tags||[]).join(" ")].join(" ").toLowerCase();
  return hay.indexOf(q)>=0;
}
function applyFilter(){
  let n=0;
  const q=(state.q||"").toLowerCase();
  document.querySelectorAll(".row").forEach(r=>{
    const e=EVENTS[Number(r.dataset.idx)];
    const ok=(state.type==="全部"||r.dataset.type===state.type)&&
             (state.imp===0||Number(r.dataset.imp)===state.imp)&&
             (!q||matchEvent(e,q));
    r.style.display=ok?"":"none"; if(ok)n++;
  });
  const filtered=(state.type!=="全部"||state.imp!==0||state.q);
  document.getElementById("cnt").textContent=filtered?("筛得 "+n+" 事"):("共 "+EVENTS.length+" 事");
  document.getElementById("empty").hidden=n>0;

  const e=EVENTS[idx];

  document.getElementById("dTitle").textContent=e.t;
  document.getElementById("dMeta").innerHTML=
    '<span class="tag">'+e.dyn+'</span><span class="tag">'+e.per+'</span><span class="tag">'+e.type+'</span><span class="stars">'+stars(e.imp)+'</span>';
  document.getElementById("dSum").textContent=e.sum;
  toggle("secCau",e.cau,"dCau"); toggle("secEff",e.eff,"dEff");
  document.getElementById("dTip").textContent=e.tip;
  toggle("secPpl",e.ppl.length?e.ppl.join("、"):null,"dPpl");
  toggle("secLoc",e.loc||null,"dLoc");
  toggle("secTag",e.tags.length?e.tags.join("、"):null,"dTag");
  const rel=document.getElementById("dRel"); rel.innerHTML="";
  document.getElementById("secRel").style.display=e.rel.length?"":"none";
  e.rel.forEach(name=>{
    const b=document.createElement("button"); b.textContent=name;
    b.addEventListener("click",()=>jumpTo(name));
    rel.appendChild(b);
  });
  document.getElementById("dSrc").textContent=e.slug?("wiki 溯源："+e.slug):"wiki 溯源：尚未归档";

function jumpTo(title){
  const idx=EVENTS.findIndex(e=>e.t===title);
  if(idx<0)return;
  closeDrawer();
  switchView("timeline");
  const row=document.querySelector('.row[data-idx="'+idx+'"]');
  if(!row)return;
  row.style.display="";
  row.scrollIntoView({block:"center"});
  row.classList.remove("flash"); void row.offsetWidth;
  row.classList.add("flash");
  setTimeout(()=>row.classList.remove("flash"),1500);
}
const toBand=document.getElementById("toBand");
const bands=[...document.querySelectorAll(".band")];
let curBand=bands[0]||null;
function trackBand(){
  const tlVisible=!document.getElementById("view-timeline").hidden;
  const mark=window.scrollY+window.innerHeight*0.5;
  let best=null;
  bands.forEach(b=>{ if(b.getBoundingClientRect().top+window.scrollY<=mark) best=b; });
  if(best) curBand=best;
  toBand.hidden=!tlVisible||!curBand||window.scrollY<30;
}
window.addEventListener("scroll",trackBand,{passive:true});
window.addEventListener("resize",trackBand);
trackBand();
toBand.addEventListener("click",()=>{
  if(!curBand) return;
  curBand.scrollIntoView({block:"start"});
  curBand.classList.remove("flash"); void curBand.offsetWidth;
  curBand.classList.add("flash");
  setTimeout(()=>curBand.classList.remove("flash"),1500);
});

  const a=6378245.0, ee=0.00669342162296594323;
  function tx(x,y){
    let r=-100+2*x+3*y+.2*y*y+.1*x*y+.2*Math.sqrt(Math.abs(x));
    r+=(20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3;
    r+=(20*Math.sin(y*Math.PI)+40*Math.sin(y/3*Math.PI))*2/3;
    r+=(160*Math.sin(y/12*Math.PI)+320*Math.sin(y*Math.PI/30))*2/3;
    return r;
  }
  function ty(x,y){
    let r=300+x+2*y+.1*x*x+.1*x*y+.1*Math.sqrt(Math.abs(x));
    r+=(20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3;
    r+=(20*Math.sin(x*Math.PI)+40*Math.sin(x/3*Math.PI))*2/3;
    r+=(150*Math.sin(x/12*Math.PI)+300*Math.sin(x/30*Math.PI))*2/3;
    return r;
  }
  const dlat=tx(lng-105,lat-35), dlng=ty(lng-105,lat-35);
  const rad=lat/180*Math.PI, magic=1-ee*Math.sin(rad)*Math.sin(rad), sq=Math.sqrt(magic);
  const flat=dlat*180/(a*(1-ee)/(magic*sq)*Math.PI);
  const flng=dlng*180/(a/sq*Math.cos(rad)*Math.PI);
  return [lat+flat,lng+flng];
}
function initMap(){
  if(mapInited) return; mapInited=true;
  mapObj=L.map("map",{zoomControl:true}).setView([34,110],5);
  L.tileLayer("https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}",
    {subdomains:["1","2","3","4"],maxZoom:18,opacity:.78,attribution:"高德地图"}).addTo(mapObj);
  markers=L.layerGroup().addTo(mapObj);
  drawMarkers();
}
/* 门类配色（古籍五色，军事用墨蓝、经济用竹青、文化用靛蓝、制度用赭金、政治朱砂） */
const TYPE_COLORS={"政治":"#9e3d26","军事":"#37474f","经济":"#4f6d3a","文化":"#3d5a80","制度":"#8a6d2c"};
function drawMarkers(){
  if(!markers) return;
  markers.clearLayers();
  const allMode=yrAll.classList.contains("on"), cyr=+yrSlider.value, R=50, q=(state.q||"").toLowerCase();
  EVENTS.forEach((e,idx)=>{
    const c=SAMPLE_COORDS[e.t]; if(!c) return;
    if(state.type!=="全部" && e.type!==state.type) return;
    if(state.imp!==0 && e.imp!==state.imp) return;
    if(q && !matchEvent(e,q)) return;
    if(!allMode){
      if(e.y===null) return;               /* 播放/过滤时 era 空心圈不霸屏 */
      if(Math.abs(e.y-cyr)>R) return;
    }
    const g=wgs84ToGcj02(c[0],c[1]);
    const col=TYPE_COLORS[e.type]||"#9e3d26";
    const isEra=e.m==="era";
    const m=L.circleMarker(g,{
      radius:isEra?9:7, color:col, weight:1.5,
      fillColor:isEra?"#f5f1e6":col, fillOpacity:isEra?.7:.78,
      dashArray:isEra?"3 3":null
    });
    if(allMode){
      m.bindTooltip(e.t);
    }else{
      m.bindTooltip(e.t+" "+fmtShort(e),{permanent:true,direction:"top",offset:[0,-7],className:"mp-label"});
    }
    m.bindPopup(popupHTML(e),{closeButton:false,offset:[0,-6]});
    markers.addLayer(m);
  });
}
function popupHTML(e){
  const yr=e.m==="era"?(e.era+" · "+e.eraSub):fmt(e);
  return '<div class="mp-t">'+e.t+'</div><div class="mp-y">'+yr+' · '+e.type+'</div><div class="mp-s">'+e.sum+'</div>';
}
function fmtYear(v){return v<0?("前 "+(-v)+" 年"):(v+" 年");}
let playing=false, playTimer=null;
const playBtn=document.getElementById("playBtn");
function togglePlay(){
  playing=!playing;
  playBtn.textContent=playing?"⏸ 暂停":"▶ 播放";
  playBtn.classList.toggle("on",playing);
  if(playing){
    yrAll.classList.remove("on");
    playTimer=setInterval(()=>{
      let v=+yrSlider.value+5;
      if(v>-473) v=-770;
      yrSlider.value=v;
      yrLabel.textContent=fmtYear(v)+" ±50";
      drawMarkers();
    },600);
  }else{
    clearInterval(playTimer);
  }
}
playBtn.addEventListener("click",togglePlay);
function pickYearFilter(){yrAll.classList.remove("on");yrLabel.textContent=fmtYear(+yrSlider.value)+" ±50";drawMarkers();}
yrSlider.addEventListener("input",()=>{if(playing)togglePlay();pickYearFilter();});
yrAll.addEventListener("click",()=>{yrAll.classList.add("on");yrLabel.textContent="全部年份";drawMarkers();});
/* 分期链接：若在地图视图，先切回时间轴再跳锚点 */
document.querySelectorAll(".bar a.jump").forEach(a=>{
  a.addEventListener("click",()=>switchView("timeline"));
});
/* ---- 抽屉：点击背景关闭 ---- */
document.getElementById("overlay").addEventListener("click",closeDrawer);
/* ---- 复习模式：设置界面 + 三种模式 ---- */
let rvInit=false, rvState=null;
const rvCfg={type:"全部",imp:0,per:"全部",q:"",numMode:"all",num:10,mode:"train"};
function initReview(){
  if(rvInit) return; rvInit=true;
  rvBtns(document.getElementById("rvTypeBtns"),[["全部","全部"],["政治","政治"],["军事","军事"],["经济","经济"],["文化","文化"],["制度","制度"]],v=>{rvCfg.type=v;updateCount();},"全部");
  rvBtns(document.getElementById("rvImpBtns"),[["全部",0],["★★★",3],["★★",2],["★",1]],v=>{rvCfg.imp=v;updateCount();},0);
  rvBtns(document.getElementById("rvPerBtns"),[["全部","全部"],["原始社会",0],["春秋",1]],v=>{rvCfg.per=v;updateCount();},"全部");
  document.getElementById("rvQ").addEventListener("input",e=>{rvCfg.q=e.target.value.trim();updateCount();});
  document.getElementById("rvAll").addEventListener("click",()=>{rvCfg.numMode="all";document.getElementById("rvAll").classList.add("on");document.getElementById("rvNum").disabled=true;});
  document.getElementById("rvNum").addEventListener("input",e=>{
    rvCfg.numMode="num";rvCfg.num=Math.max(1,parseInt(e.target.value)||10);
    document.getElementById("rvAll").classList.remove("on");document.getElementById("rvNum").disabled=false;
  });
  document.getElementById("rvModes").querySelectorAll(".rv-mode-btn").forEach(b=>{
    b.addEventListener("click",()=>{document.getElementById("rvModes").querySelectorAll(".rv-mode-btn").forEach(x=>x.classList.remove("on"));b.classList.add("on");rvCfg.mode=b.dataset.mode;});
  });
  document.getElementById("rvStart").addEventListener("click",startReview);
  document.getElementById("rvShow").addEventListener("click",()=>{
    document.getElementById("rvCard").classList.add("flip");
    document.getElementById("rvShow").hidden=true;
    const roam=rvState.mode==="roam";
    document.getElementById("rvFail").hidden=roam;
    document.getElementById("rvOk").hidden=roam;
    document.getElementById("rvNext").hidden=!roam;
  });
  document.getElementById("rvFail").addEventListener("click",()=>answer(false));
  document.getElementById("rvOk").addEventListener("click",()=>answer(true));
  document.getElementById("rvNext").addEventListener("click",()=>{const s=rvState;s.queue.shift();s.processed++;s.roundDone++;showCard();});
  document.getElementById("rvAgain").addEventListener("click",()=>showSetup());
  const rvExit=document.getElementById("rvExit");
  let exitArmed=false, exitTimer=null;
  rvExit.addEventListener("click",()=>{
    if(!exitArmed){
      exitArmed=true; rvExit.textContent="确认退出？"; rvExit.classList.add("armed");
      exitTimer=setTimeout(()=>{exitArmed=false;rvExit.textContent="退出";rvExit.classList.remove("armed");},3000);
      return;
    }
    clearTimeout(exitTimer); exitArmed=false;
    rvExit.textContent="退出"; rvExit.classList.remove("armed");
    showSetup();
  });
  showSetup();
  updateCount();
}
function rvBtns(el,items,onChange,active){
  el.innerHTML="";
  items.forEach(it=>{
    const b=document.createElement("button");
    b.className="f"+(active===it[1]?" on":"");
    b.textContent=it[0];
    b.addEventListener("click",()=>{el.querySelectorAll(".f").forEach(x=>x.classList.remove("on"));b.classList.add("on");onChange(it[1]);});
    el.appendChild(b);
  });
}
function poolFromFilters(){
  const q=rvCfg.q.toLowerCase();
  return EVENTS.filter(e=>{
    if(rvCfg.type!=="全部"&&e.type!==rvCfg.type)return false;
    if(rvCfg.imp!==0&&e.imp!==rvCfg.imp)return false;
    if(rvCfg.per!=="全部"&&e.ch!==rvCfg.per)return false;
    if(q&&!matchEvent(e,q))return false;
    return true;
  });
}
function wrongPool(){
  return EVENTS.filter(e=>localStorage.getItem("ht-review-"+e.t)==="fail");
}
function updateCount(){
  document.getElementById("rvCount").textContent="当前范围共 "+poolFromFilters().length+" 题";
}
function showSetup(){
  document.getElementById("rvSetup").style.display="";
  document.getElementById("rvStage").style.display="none";
  document.getElementById("rvDone").hidden=true;
  document.getElementById("rvWarn").hidden=true;
}
function startReview(){
  const warn=document.getElementById("rvWarn");
  let pool;
  if(rvCfg.mode==="wrong"){
    pool=wrongPool();
    if(pool.length===0){warn.textContent="暂无错题，先去「针对训练」练几轮。";warn.hidden=false;return;}
  }else{
    pool=poolFromFilters();
    if(pool.length===0){warn.textContent="该范围内没有题目，请调整筛选条件。";warn.hidden=false;return;}
    const max=rvCfg.numMode==="all"?pool.length:Math.min(rvCfg.num,pool.length);
    shuffle(pool); pool=pool.slice(0,max);
  }
  pool=pool.map(e=>({e})); /* 统一包装为 {e}，供 showCard/answer 使用 */
  rvState={queue:pool,fails:[],processed:0,total:pool.length,round:1,okCount:0,failCount:0,mode:rvCfg.mode,roundTotal:pool.length,roundDone:0};
  document.getElementById("rvSetup").style.display="none";
  document.getElementById("rvStage").style.display="";
  document.getElementById("rvDone").hidden=true;
  showCard();
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}}
function showCard(){
  const s=rvState;
  if(s.queue.length===0){
    if(s.mode!=="roam"&&s.fails.length>0){s.queue=s.fails;s.fails=[];s.round++;s.roundTotal=s.queue.length;s.roundDone=0;showCard();return;}
    finishRound();return;
  }
  s.cur=s.queue[0];
  document.getElementById("rvTitle").textContent=s.cur.e.t;
  document.getElementById("rvFrontTags").innerHTML='<span class="tag">'+s.cur.e.type+'</span><span class="stars">'+stars(s.cur.e.imp)+'</span>';
  document.getElementById("rvYear").textContent=s.cur.e.m==="era"?(s.cur.e.era+" · "+s.cur.e.eraSub):fmt(s.cur.e);
  document.getElementById("rvSum").textContent=s.cur.e.sum||"";
  const tip=document.getElementById("rvTip");
  if(s.cur.e.tip){tip.style.display="";tip.textContent=s.cur.e.tip;}else{tip.style.display="none";}
  const kv=[];
  if(s.cur.e.loc)kv.push("地点："+s.cur.e.loc);
  if(s.cur.e.ppl&&s.cur.e.ppl.length)kv.push("人物："+s.cur.e.ppl.join("、"));
  document.getElementById("rvKv").textContent=kv.join("　");
  document.getElementById("rvCard").classList.remove("flip");
  document.getElementById("rvShow").hidden=false;
  document.getElementById("rvFail").hidden=true;
  document.getElementById("rvOk").hidden=true;
  document.getElementById("rvNext").hidden=true;
  updateProg();
}
function updateProg(){
  const s=rvState;
  const rt=s.roundTotal||s.total;
  document.getElementById("rvProg").textContent=(s.mode==="roam"?"漫游":(s.mode==="wrong"?"错题":"训练"))+" 第 "+Math.min(s.roundDone+1,rt)+" / "+rt+" 张";
  document.getElementById("rvFails").textContent=s.mode==="roam"?"不计错题":((s.failCount>0?("错题 "+s.failCount+" · "):"")+(s.round>1?("第 "+s.round+" 轮"):""));
  document.getElementById("rvBarIn").style.width=(s.processed/s.total*100)+"%";
}
function answer(ok){
  const s=rvState;
  const card=s.queue.shift();
  s.processed++; s.roundDone++;
  if(ok){s.okCount++;localStorage.setItem("ht-review-"+card.e.t,"ok");}
  else{s.failCount++;s.fails.push(card);localStorage.setItem("ht-review-"+card.e.t,"fail");}
  showCard();
}
function finishRound(){
  const s=rvState;
  document.getElementById("rvStage").style.display="none";
  document.getElementById("rvDone").hidden=false;
  const stat=document.getElementById("rvDoneStat");
  if(s.mode==="roam"){stat.textContent="共 "+s.total+" 张 · 随机漫游完成";}
  else{stat.textContent="共 "+s.total+" 张 · 记住 "+s.okCount+" · 错题重练 "+s.failCount+" 次";}
  document.getElementById("rvBarIn").style.width="100%";
}
</script>
