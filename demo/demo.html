<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国古代史时间轴 · 打样</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/900.css">
<style>
:root{
  --paper:#f5f1e6; --paper2:#faf7ee; --paper-dim:#efe9da;
  --ink:#2e2a23; --ink2:#5c554a; --ink3:#8a8072;
  --cin:#9e3d26; --cin-soft:#f4e9e3;
  --line:#ddd3bf; --line2:#c9bda2;
  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--serif); font-size:16px; line-height:1.9;
}
body::after{
  content:""; position:fixed; inset:0; z-index:80; pointer-events:none;
  background-image:
    repeating-linear-gradient(0deg, rgba(60,50,35,.018) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, rgba(60,50,35,.014) 0 1px, transparent 1px 4px);
}
@media (prefers-reduced-motion: no-preference){
  html{scroll-behavior:smooth}
  .drawer{transition:transform .3s cubic-bezier(.2,.75,.25,1)}
  .flash .body{animation:flashbg 1.4s ease-out}
}
@keyframes flashbg{0%{background:#efe2c8}100%{background:transparent}}
.wrap{max-width:940px;margin:0 auto;padding:0 28px 110px}
header{padding:56px 0 28px}
.headrow{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.overline{font-size:12px;letter-spacing:.22em;color:var(--cin)}
h1{font-size:30px;font-weight:900;letter-spacing:.06em;margin-top:10px}
.sub{margin-top:8px;color:var(--ink2);font-size:14.5px}
.count{text-align:right;font-size:13px;color:var(--ink3);line-height:1.7;flex:none}
.bar{
  position:sticky; top:0; z-index:40; background:var(--paper);
  border-bottom:1px solid var(--line);
  padding:10px 0; display:flex; flex-wrap:wrap; gap:6px 20px; align-items:center; font-size:13.5px;
}
.group{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.glabel{color:var(--ink3);letter-spacing:.2em;margin-right:4px;font-size:12.5px}
button.f{
  font-family:var(--serif); font-size:13.5px; background:none; cursor:pointer;
  border:1px solid transparent; color:var(--ink2); padding:1px 8px; line-height:1.8;
}
button.f:hover{color:var(--cin)}
button.f.on{background:var(--cin); color:var(--paper2); border-color:var(--cin)}
a.jump{color:var(--ink2); text-decoration:none; border-bottom:1px solid var(--line2); padding-bottom:1px}
a.jump:hover{color:var(--cin); border-color:var(--cin)}
.bar .cnt{margin-left:auto; color:var(--ink3); font-size:12.5px}
.band{margin:46px 0 2px; display:flex; align-items:center; gap:14px; scroll-margin-top:64px}
.band .sq{width:9px; height:9px; background:var(--cin); flex:none}
.band .no{font-size:12px; letter-spacing:.3em; color:var(--cin); flex:none}
.band h2{font-size:21px; font-weight:900; letter-spacing:.08em; flex:none}
.band .note{font-size:12.5px; color:var(--ink3); flex:none}
.band .rule{flex:1; height:1px; background:var(--line)}
.row{display:grid; grid-template-columns:8.5rem 1fr; cursor:pointer}
.row:hover .body{background:var(--paper-dim)}
.year{
  padding:22px 1.4rem 22px 0; text-align:right;
  font-size:14px; color:var(--ink2); line-height:1.7;
  border-bottom:1px solid var(--line);
  font-variant-numeric:tabular-nums;
}
.year .era{display:block; color:var(--ink3); font-size:12.5px; line-height:1.65}
.body{
  position:relative; border-left:1px solid var(--line);
  padding:20px 0 20px 1.6rem; border-bottom:1px solid var(--line);
}
.body::before{
  content:""; position:absolute; left:0; top:27px; transform:translateX(-50%);
  width:7px; height:7px; background:var(--paper); border:1px solid var(--ink3);
}
.row.exact .body::before{background:var(--cin); border-color:var(--cin)}
.row.era .body::before{border-radius:50%; background:var(--paper)}
.row.approx .body::before{border-style:dashed; background:var(--paper)}
.row.range .body::before{height:17px; width:5px; top:22px; border-color:var(--cin)}
.title-row{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
h3{font-size:17.5px; font-weight:700}
.stars{font-size:12px; letter-spacing:2px; color:var(--cin); flex:none}
.stars .off{color:#cfc4ab}
.tag{font-size:11.5px; color:var(--ink2); border:1px solid var(--line2); padding:0 6px; line-height:1.8; flex:none}
.summary{margin-top:3px; color:var(--ink2); font-size:14.5px; max-width:70ch; line-height:1.85}
.drawer{
  position:fixed; top:0; right:0; height:100dvh; width:min(430px,94vw);
  background:var(--paper2); border-left:1px solid var(--line2);
  box-shadow:-16px 0 40px rgba(46,42,35,.10);
  transform:translateX(105%); z-index:90; overflow-y:auto;
  padding:24px 26px 64px;
}
.drawer.open{transform:none}
.d-close{background:none; border:none; font-family:var(--serif); font-size:13px; color:var(--ink3); cursor:pointer; letter-spacing:.2em; padding:0}
.d-close:hover{color:var(--cin)}
.d-year{margin-top:20px; font-size:15px; color:var(--cin); letter-spacing:.05em}
.d-title{font-size:25px; font-weight:900; margin-top:4px; letter-spacing:.04em}
.d-meta{display:flex; gap:6px; flex-wrap:wrap; margin-top:12px; align-items:center}
.d-sec{margin-top:22px}
.d-label{font-size:12px; letter-spacing:.3em; color:var(--ink3); margin-bottom:5px}
.d-text{font-size:14.5px; line-height:1.9}
.d-kv{font-size:14px; color:var(--ink2); line-height:1.9}
.d-tip{margin-top:24px; border-left:3px solid var(--cin); background:var(--cin-soft); padding:12px 14px}
.d-tip .d-label{color:var(--cin)}
.relchips{display:flex; flex-wrap:wrap; gap:6px}
.relchips button{
  font-family:var(--serif); font-size:13px; background:none; cursor:pointer;
  border:1px solid var(--line2); color:var(--ink2); padding:2px 10px; line-height:1.8;
}
.relchips button:hover{color:var(--cin); border-color:var(--cin)}
.src{margin-top:26px; padding-top:14px; border-top:1px solid var(--line); font-size:12.5px; color:var(--ink3)}
.empty{padding:64px 0; text-align:center; color:var(--ink3); font-size:14px; letter-spacing:.1em}
footer{margin-top:70px; font-size:12.5px; color:var(--ink3); line-height:1.8; border-top:1px solid var(--line); padding-top:16px}
@media (max-width:760px){
  .wrap{padding:0 18px 80px}
  .row{grid-template-columns:1fr}
  .year{text-align:left; padding:14px 0 0; border-bottom:none}
  .year .era{display:inline; margin-left:8px}
  .body{border-left:none; padding:2px 0 18px}
  .body::before{display:none}
  h1{font-size:25px}
  .count{display:none}
}
</style>
</head>

</div>

function fmt(e){
  if(e.m==="era") return null;
  if(e.m==="range") return "前 "+(-e.yr[0])+" 至 "+(-e.yr[1]);
  const abs=e.y<0?("前 "+(-e.y)):(""+e.y);
  return (e.m==="approx"?"约":"")+abs;
}
function fmtShort(e){
  if(e.m==="era") return e.era;
  if(e.m==="range") return "前 "+(-e.yr[0])+"~"+(-e.yr[1]);
  const abs=e.y<0?("前 "+(-e.y)):(""+e.y);
  return (e.m==="approx"?"约":"")+abs;
}
function stars(n){
  let s="";
  for(let i=1;i<=3;i++) s+= i<=n ? "★" : '<span class="off">★</span>';
  return s;
}

function mkBtns(groupId,items,key,render){
  const g=document.getElementById(groupId);
  items.forEach(it=>{
    const label=render?it[0]:it, val=render?it[1]:it;
    const b=document.createElement("button");
    b.className="f"+(state[key]===val?" on":""); b.textContent=label;
    b.addEventListener("click",()=>{state[key]=val;
      g.querySelectorAll("button.f").forEach(x=>x.classList.remove("on"));
      b.classList.add("on"); applyFilter();});
    g.appendChild(b);
  });
}

  let n=0;
  document.querySelectorAll(".row").forEach(r=>{
    const ok=(state.type==="全部"||r.dataset.type===state.type)&&
             (state.imp===0||Number(r.dataset.imp)===state.imp);
    r.style.display=ok?"":"none"; if(ok)n++;
  });
  document.getElementById("cnt").textContent=(state.type==="全部"&&state.imp===0)?("共 "+EVENTS.length+" 事"):("筛得 "+n+" 事");
  document.getElementById("empty").hidden=n>0;
}
document.getElementById("cnt").textContent="共 "+EVENTS.length+" 事";
const drawer=document.getElementById("drawer");
function openDrawer(idx){
  const e=EVENTS[idx];
  document.getElementById("dYear").textContent=e.m==="era"?(e.era+" · "+e.eraSub):fmt(e);
  document.getElementById("dTitle").textContent=e.t;
  document.getElementById("dMeta").innerHTML=
    '<span class="tag">'+e.dyn+'</span><span class="tag">'+e.per+'</span><span class="tag">'+e.type+'</span><span class="stars">'+stars(e.imp)+'</span>';
  document.getElementById("dSum").textContent=e.sum;
  toggle("secCau",e.cau,"dCau"); toggle("secEff",e.eff,"dEff");
  document.getElementById("dTip").textContent=e.tip;
  toggle("secPpl",e.ppl.length?e.ppl.join("、"):null,"dPpl");
  toggle("secLoc",e.loc||null,"dLoc");
  toggle("secTag",e.tags.length?e.tags.join("、"):null,"dTag");
  const rel=document.getElementById("dRel"); rel.innerHTML="";
  document.getElementById("secRel").style.display=e.rel.length?"":"none";
  e.rel.forEach(name=>{
    const b=document.createElement("button"); b.textContent=name;
    b.addEventListener("click",()=>jumpTo(name));
    rel.appendChild(b);
  });
  document.getElementById("dSrc").textContent=e.slug?("wiki 溯源："+e.slug):"wiki 溯源：尚未归档";
  drawer.classList.add("open"); drawer.setAttribute("aria-hidden","false");
}
function toggle(secId,val,txtId){
  document.getElementById(secId).style.display=val?"":"none";
  if(val)document.getElementById(txtId).textContent=val;
}
function closeDrawer(){drawer.classList.remove("open");drawer.setAttribute("aria-hidden","true")}
document.getElementById("dClose").addEventListener("click",closeDrawer);
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDrawer()});
function jumpTo(title){
  const idx=EVENTS.findIndex(e=>e.t===title);
  if(idx<0)return;
  closeDrawer();
  const row=document.querySelector('.row[data-idx="'+idx+'"]');
  if(!row)return;
  row.style.display="";
  row.scrollIntoView({block:"center"});
  row.classList.remove("flash"); void row.offsetWidth;
  row.classList.add("flash");
  setTimeout(()=>row.classList.remove("flash"),1500);
}
</script>
</body>
</html>
